
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101d3a">
<title>BOMBAY GUJARAT ROADLINES</title>
<style>
:root{--navy:#101d3a;--blue:#174a91;--gold:#e6b84c;--bg:#f2f5fa;--white:#fff;--text:#1d2939;--muted:#667085;--border:#e1e6ef;--red:#c93636;--green:#16834a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{background:linear-gradient(120deg,var(--navy),var(--blue));color:white;padding:17px;position:sticky;top:0;z-index:10;box-shadow:0 3px 12px #0002}
.brand{font-size:19px;font-weight:800;letter-spacing:.5px}
.subtitle{font-size:11px;color:#f1d58a;margin-top:5px}
.headerrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
#clock{font-size:11px;text-align:right}
nav{display:flex;gap:6px;overflow-x:auto;background:white;padding:9px;position:sticky;top:69px;z-index:9;border-bottom:1px solid var(--border)}
nav button{white-space:nowrap;border:0;border-radius:8px;padding:10px 12px;background:#edf2fa;color:var(--navy);font-weight:bold}
nav button.active{background:var(--blue);color:white}
main{max-width:1250px;margin:auto;padding:14px}
.page{display:none}.page.active{display:block}
h2{font-size:21px;color:var(--navy);margin:8px 0 15px}
h3{font-size:16px;color:var(--navy);margin-top:4px}
.card{background:white;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:13px;box-shadow:0 2px 7px #10204008}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px}
.statlabel{font-size:12px;color:var(--muted)}
.statvalue{font-size:22px;font-weight:800;color:var(--navy);margin-top:8px;overflow-wrap:anywhere}
.gold{color:#a87912}.red{color:var(--red)}.green{color:var(--green)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:11px}
label{display:block;font-size:12px;font-weight:bold;color:#475467}
input,select,textarea{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid #cfd7e4;border-radius:8px;font-size:14px;background:white;color:var(--text)}
textarea{min-height:65px;resize:vertical}
button{cursor:pointer}
.btn{border:0;border-radius:8px;padding:10px 13px;background:var(--blue);color:white;font-weight:bold;margin:4px 3px 4px 0}
.btn.goldbtn{background:#ae801d}.btn.greenbtn{background:var(--green)}.btn.redbtn{background:var(--red)}.btn.graybtn{background:#667085}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left;font-size:12px;vertical-align:top}
th{background:#edf2fa;color:var(--navy)}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#e8effb;color:#174a91;font-size:11px;font-weight:bold}
.muted{font-size:12px;color:var(--muted);line-height:1.5}
.search{max-width:420px;margin:0 0 12px}
.actions{margin-top:10px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
footer{text-align:center;padding:22px;color:var(--muted);font-size:11px}
@media(max-width:600px){.brand{font-size:15px}main{padding:9px}nav{top:65px}.statvalue{font-size:19px}}
@media print{header,nav,.no-print,footer{display:none!important}body{background:white}main{padding:0}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<header>
 <div class="headerrow">
  <div>
   <div class="brand">BOMBAY GUJARAT ROADLINES</div>
   <div class="subtitle">TRANSPORT & LOGISTICS MANAGEMENT</div>
  </div>
  <div id="clock"></div>
 </div>
</header>

<nav class="no-print" id="nav"></nav>
<main id="app"></main>
<footer>BOMBAY GUJARAT ROADLINES · TRANSPORT & LOGISTICS MANAGEMENT</footer>

<script>
"use strict";

/* ---------------- DATABASE ---------------- */

const DBKEY="bgrl_master_database_v1";
const blankDB=()=>({
 version:1,
 bookings:[],biltis:[],customers:[],owners:[],drivers:[],
 payments:[],expenses:[],challans:[],deliveries:[],documents:[]
});

let db=blankDB();

function loadDB(){
 try{
  const raw=localStorage.getItem(DBKEY);
  if(raw){
   const parsed=JSON.parse(raw);
   Object.keys(db).forEach(k=>{
    if(Array.isArray(db[k])) db[k]=Array.isArray(parsed[k])?parsed[k]:[];
   });
  }
 }catch(e){alert("Saved data could not be read. Please restore a backup.");}
}
function saveDB(){
 try{localStorage.setItem(DBKEY,JSON.stringify(db));}
 catch(e){alert("Storage full or unavailable. Download a backup and clear some browser storage.");}
}
function uid(){return "BGRL-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7).toUpperCase();}
function today(){return new Date().toISOString().slice(0,10);}
function money(v){return "₹"+(Number(v)||0).toLocaleString("en-IN",{maximumFractionDigits:2});}
function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function sum(arr,fn){return arr.reduce((a,x)=>a+(Number(fn(x))||0),0);}
function byId(arr,id){return arr.find(x=>x.id===id);}
function bookingLabel(b){return (b.lr||b.id)+" | "+(b.truck||"No truck")+" | "+(b.from||"")+" → "+(b.to||"");}
function paidFor(id,type){
 return sum(db.payments.filter(p=>p.bookingId===id&&p.partyType===type),p=>p.amount);
}
function customerDue(b){return Math.max(0,(Number(b.customerFreight)||0)-paidFor(b.id,"customer"));}
function ownerDue(b){return Math.max(0,(Number(b.ownerFreight)||0)-paidFor(b.id,"owner"));}
function brokerage(b){return (Number(b.customerFreight)||0)-(Number(b.ownerFreight)||0);}

/* ---------------- NAVIGATION ---------------- */

const pages=[
 ["dashboard","Dashboard"],["bookings","Bookings"],["biltis","Bilti / LR"],
 ["customers","Customers"],["owners","Truck Owners"],["drivers","Drivers"],
 ["payments","Payments"],["expenses","Expenses"],["challans","Challans"],
 ["deliveries","Delivery / POD"],["documents","Documents"],["reports","Reports"],
 ["backup","Backup"]
];
let currentPage="dashboard";

function showPage(id){
 currentPage=id;
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===id));
 renderPage();
 window.scrollTo(0,0);
}
function buildNav(){
 document.getElementById("nav").innerHTML=pages.map(p=>
  `<button data-page="${p[0]}" onclick="showPage('${p[0]}')">${p[1]}</button>`
 ).join("");
}

/* ---------------- FORM DEFINITIONS ---------------- */

const schemas={
 bookings:{
  title:"Booking Management",singular:"Booking",key:"bookings",
  fields:[
   ["date","Booking Date","date",true],["lr","Booking / LR Reference","text"],
   ["truck","Truck Number","text",true],["from","From","text",true],["to","To","text",true],
   ["customer","Customer Name","text",true],["gstin","Customer GSTIN","text"],
   ["owner","Truck Owner","text"],["driver","Driver Name","text"],["driverMobile","Driver Mobile","tel"],
   ["goods","Goods Description","text"],["weight","Weight","number"],["packages","Packages","number"],
   ["customerFreight","Customer Freight ₹","number",true],["ownerFreight","Owner Freight ₹","number",true],
   ["status","Booking Status","select",false,["Booked","Loaded","In Transit","Delivered","Cancelled"]],
   ["remarks","Remarks","textarea"]
  ],
  columns:["date","truck","from","to","customer","customerFreight","ownerFreight","status"]
 },
 biltis:{
  title:"Bilti / Lorry Receipt",singular:"Bilti",key:"biltis",
  fields:[
   ["lrNo","Bilti / LR Number","text",true],["date","LR Date","date",true],
   ["bookingId","Linked Booking","booking"],["consignor","Consignor","text",true],
   ["consignorAddress","Consignor Address","textarea"],["consignee","Consignee","text",true],
   ["consigneeAddress","Consignee Address","textarea"],["truck","Truck Number","text",true],
   ["from","From","text"],["to","To","text"],["goods","Goods Description","text"],
   ["packages","Packages","number"],["weight","Weight","number"],["freight","Freight ₹","number"],
   ["paymentTerms","Freight Payment","select",false,["To Pay","Paid","To Be Billed"]],
   ["eway","E-Way Bill Number","text"],["ewayExpiry","E-Way Bill Expiry","date"],
   ["remarks","Remarks","textarea"]
  ],
  columns:["lrNo","date","truck","consignor","consignee","from","to","freight"]
 },
 customers:{
  title:"Customer Records & Ledger",singular:"Customer",key:"customers",
  fields:[
   ["name","Customer Name","text",true],["mobile","Mobile","tel"],["gstin","GSTIN","text"],
   ["address","Address","textarea"],["creditLimit","Credit Limit ₹","number"],["notes","Notes","textarea"]
  ],columns:["name","mobile","gstin","creditLimit"]
 },
 owners:{
  title:"Truck Owner Records & Ledger",singular:"Truck Owner",key:"owners",
  fields:[
   ["name","Owner Name","text",true],["mobile","Mobile","tel"],["truck","Truck Number","text"],
   ["address","Address","textarea"],["bank","Bank / UPI Details","text"],["notes","Notes","textarea"]
  ],columns:["name","mobile","truck","bank"]
 },
 drivers:{
  title:"Driver Records",singular:"Driver",key:"drivers",
  fields:[
   ["name","Driver Name","text",true],["mobile","Mobile","tel"],["licence","Licence Number","text"],
   ["expiry","Licence Expiry","date"],["address","Address","textarea"],["notes","Notes","textarea"]
  ],columns:["name","mobile","licence","expiry"]
 },
 payments:{
  title:"Payments & Receipts",singular:"Payment",key:"payments",
  fields:[
   ["date","Payment Date","date",true],["bookingId","Booking","booking",true],
   ["partyType","Payment Type","select",true,["customer","owner"]],
   ["amount","Amount ₹","number",true],["mode","Payment Mode","select",false,["Cash","UPI","Bank Transfer","Cheque","Other"]],
   ["reference","UTR / Reference","text"],["remarks","Remarks","textarea"]
  ],columns:["date","bookingId","partyType","amount","mode","reference"]
 },
 expenses:{
  title:"Expenses & Accounting",singular:"Expense",key:"expenses",
  fields:[
   ["date","Date","date",true],["category","Category","select",true,["Office","Telephone","Fuel","Loading","Unloading","Salary","Commission","Travel","Other"]],
   ["description","Description","text",true],["amount","Amount ₹","number",true],
   ["mode","Payment Mode","select",false,["Cash","UPI","Bank","Other"]],["remarks","Remarks","textarea"]
  ],columns:["date","category","description","amount","mode"]
 },
 challans:{
  title:"Transport Challans",singular:"Challan",key:"challans",
  fields:[
   ["number","Challan Number","text",true],["date","Date","date",true],
   ["bookingId","Booking","booking"],["truck","Truck Number","text"],
   ["from","From","text"],["to","To","text"],["driver","Driver","text"],
   ["advance","Advance ₹","number"],["remarks","Remarks","textarea"]
  ],columns:["number","date","truck","from","to","driver","advance"]
 },
 deliveries:{
  title:"Delivery Tracking & POD",singular:"Delivery Update",key:"deliveries",
  fields:[
   ["bookingId","Booking","booking",true],["date","Update Date","date",true],
   ["status","Delivery Status","select",true,["Booked","Loaded","In Transit","Reached Destination","Delivered","Delivery Failed"]],
   ["receivedBy","Received By","text"],["pod","POD Reference","text"],
   ["podDate","POD Date","date"],["remarks","Remarks","textarea"]
  ],columns:["date","bookingId","status","receivedBy","pod","podDate"]
 },
 documents:{
  title:"Vehicle & Driver Documents",singular:"Document",key:"documents",
  fields:[
   ["person","Vehicle / Driver Name","text",true],
   ["type","Document Type","select",true,["RC","Insurance","Fitness","Permit","PUC","Driving Licence","E-Way Bill","Other"]],
   ["number","Document Number","text"],["expiry","Expiry Date","date"],["notes","Notes","textarea"]
  ],columns:["person","type","number","expiry","notes"]
 }
};

const labels={
 id:"ID",date:"Date",lr:"Reference",truck:"Truck",from:"From",to:"To",
 customer:"Customer",gstin:"GSTIN",owner:"Owner",driver:"Driver",
 driverMobile:"Driver Mobile",goods:"Goods",weight:"Weight",packages:"Packages",
 customerFreight:"Customer Freight",ownerFreight:"Owner Freight",status:"Status",
 remarks:"Remarks",lrNo:"Bilti No.",bookingId:"Booking",consignor:"Consignor",
 consignorAddress:"Consignor Address",consignee:"Consignee",consigneeAddress:"Consignee Address",
 freight:"Freight",paymentTerms:"Payment Terms",eway:"E-Way Bill",ewayExpiry:"E-Way Expiry",
 name:"Name",mobile:"Mobile",address:"Address",creditLimit:"Credit Limit",
 bank:"Bank / UPI",notes:"Notes",licence:"Licence",expiry:"Expiry",
 partyType:"Payment Type",amount:"Amount",mode:"Mode",reference:"Reference",
 category:"Category",description:"Description",number:"Number",advance:"Advance",
 receivedBy:"Received By",pod:"POD Reference",podDate:"POD Date",person:"Person",type:"Type"
};

/* ---------------- GENERIC FORM / TABLE ---------------- */

function fieldHTML(f,obj={}){
 const [key,label,type,required,opts]=f;
 const value=obj[key]??(type==="date"?today():"");
 const req=required?"required":"";
 const safeValue=esc(value);
 if(type==="textarea")return `<label>${label}<textarea name="${key}" ${req}>${safeValue}</textarea></label>`;
 if(type==="select"){
  return `<label>${label}<select name="${key}" ${req}>${(opts||[]).map(o=>`<option value="${esc(o)}" ${String(value)===o?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
 }
 if(type==="booking"){
  return `<label>${label}<select name="${key}"><option value="">Select Booking</option>${db.bookings.map(b=>`<option value="${esc(b.id)}" ${value===b.id?"selected":""}>${esc(bookingLabel(b))}</option>`).join("")}</select></label>`;
 }
 return `<label>${label}<input name="${key}" type="${type}" value="${safeValue}" ${req} ${type==="number"?'min="0" step="0.01"':""}></label>`;
}

function formHTML(page,obj={}){
 const s=schemas[page];
 return `<div class="card">
 <h3>${obj.id?"Edit":"Add"} ${s.singular}</h3>
 <form id="recordForm">
 <input type="hidden" name="id" value="${esc(obj.id||"")}">
 ${s.fields.map(f=>fieldHTML(f,obj)).join("")}
 </form>
 <div class="actions">
 <button class="btn" onclick="saveRecord('${page}')">Save ${s.singular}</button>
 <button class="btn graybtn" onclick="renderPage()">Clear</button>
 </div></div>`;
}
function cellValue(key,r){
 if(key==="bookingId"){
  const b=byId(db.bookings,r.bookingId);
  return b?bookingLabel(b):"Booking removed";
 }
 if(key==="partyType")return r.partyType==="customer"?"Customer Received":"Owner Paid";
 if(key==="customerFreight"||key==="ownerFreight"||key==="amount"||key==="freight"||key==="advance"||key==="creditLimit")return money(r[key]);
 return r[key]??"";
}
function tableHTML(page,records){
 const s=schemas[page];
 if(!records.length)return `<div class="empty">No records found.</div>`;
 return `<div class="tablewrap"><table><thead><tr>${s.columns.map(k=>`<th>${esc(labels[k]||k)}</th>`).join("")}<th>Actions</th></tr></thead><tbody>
 ${records.map(r=>`<tr>${s.columns.map(k=>`<td>${esc(cellValue(k,r))}</td>`).join("")}
 <td><button class="btn" onclick="editRecord('${page}','${r.id}')">Edit</button>
 <button class="btn redbtn" onclick="deleteRecord('${page}','${r.id}')">Delete</button>
 ${page==="biltis"?`<button class="btn goldbtn" onclick="printBilti('${r.id}')">Print</button>`:""}
 ${page==="challans"?`<button class="btn goldbtn" onclick="printRecord('${page}','${r.id}')">Print</button>`:""}
 </td></tr>`).join("")}
 </tbody></table></div>`;
}
function saveRecord(page){
 const form=document.getElementById("recordForm");
 if(!form.reportValidity())return;
 const data=Object.fromEntries(new FormData(form).entries());
 const s=schemas[page];
 for(const f of s.fields){
  if(f[2]==="number")data[f[0]]=Number(data[f[0]]||0);
 }
 if(page==="biltis"&&!data.lrNo.trim()){alert("Bilti number required.");return;}
 if(page==="payments"&&data.amount<=0){alert("Payment amount must be greater than zero.");return;}
 if(page==="payments"){
  const b=byId(db.bookings,data.bookingId);
  if(!b){alert("Please select a valid booking.");return;}
  const limit=data.partyType==="customer"?Number(b.customerFreight):Number(b.ownerFreight);
  if(Number(data.amount)>(data.partyType==="customer"?customerDue(b):ownerDue(b))){
   if(!confirm("This payment is greater than the current outstanding balance. Save anyway?"))return;
  }
 }
 if(page==="biltis"&&db.biltis.some(x=>x.lrNo.toLowerCase()===data.lrNo.toLowerCase()&&x.id!==data.id)){
  alert("This Bilti number already exists.");return;
 }
 const arr=db[page];
 if(data.id){
  const i=arr.findIndex(x=>x.id===data.id);
  if(i>=0)arr[i]={...arr[i],...data};
 }else{
  data.id=uid();data.createdAt=new Date().toISOString();arr.unshift(data);
 }
 saveDB();renderPage();
}
function editRecord(page,id){
 const obj=byId(db[page],id);
 if(!obj)return;
 document.getElementById("formarea").innerHTML=formHTML(page,obj);
 document.getElementById("formarea").scrollIntoView({behavior:"smooth"});
}
function deleteRecord(page,id){
 if(!confirm("Delete this record permanently? Make a backup first if needed."))return;
 db[page]=db[page].filter(x=>x.id!==id);
 if(page==="bookings"){
  db.payments=db.payments.filter(x=>x.bookingId!==id);
  db.deliveries=db.deliveries.filter(x=>x.bookingId!==id);
 }
 saveDB();renderPage();
}

/* ---------------- PAGE RENDERING ---------------- */

function renderPage(){
 const root=document.getElementById("app");
 if(currentPage==="dashboard"){root.innerHTML=dashboardHTML();return;}
 if(currentPage==="reports"){root.innerHTML=reportsHTML();return;}
 if(currentPage==="backup"){root.innerHTML=backupHTML();return;}
 if(currentPage==="customers"||currentPage==="owners"){root.innerHTML=ledgerHTML(currentPage);return;}
 const s=schemas[currentPage];
 if(!s){root.innerHTML="<div class='card'>Page not found.</div>";return;}
 root.innerHTML=`<h2>${s.title}</h2>
 <div id="formarea">${formHTML(currentPage)}</div>
 <div class="card"><h3>${s.singular} Records</h3>
 <input class="search" id="searchRecords" placeholder="Search records..." oninput="filterTable('${currentPage}')">
 <div id="recordTable">${tableHTML(currentPage,db[currentPage])}</div>
 </div>`;
}
function filterTable(page){
 const q=(document.getElementById("searchRecords").value||"").toLowerCase();
 const records=db[page].filter(r=>Object.values(r).join(" ").toLowerCase().includes(q));
 document.getElementById("recordTable").innerHTML=tableHTML(page,records);
}
function dashboardHTML(){
 const dueC=sum(db.bookings,customerDue),dueO=sum(db.bookings,ownerDue);
 const freight=sum(db.bookings,b=>b.customerFreight);
 const brok=sum(db.bookings,brokerage);
 const expenses=sum(db.expenses,e=>e.amount);
 return `<h2>Business Dashboard</h2>
 <div class="grid">
 <div class="card"><div class="statlabel">Total Bookings</div><div class="statvalue">${db.bookings.length}</div></div>
 <div class="card"><div class="statlabel">Customer Freight</div><div class="statvalue">${money(freight)}</div></div>
 <div class="card"><div class="statlabel">Brokerage</div><div class="statvalue gold">${money(brok)}</div></div>
 <div class="card"><div class="statlabel">Customer Due</div><div class="statvalue red">${money(dueC)}</div></div>
 <div class="card"><div class="statlabel">Owner Due</div><div class="statvalue red">${money(dueO)}</div></div>
 <div class="card"><div class="statlabel">Expenses</div><div class="statvalue">${money(expenses)}</div></div>
 <div class="card"><div class="statlabel">Biltis Created</div><div class="statvalue">${db.biltis.length}</div></div>
 <div class="card"><div class="statlabel">Pending Deliveries</div><div class="statvalue">${db.bookings.filter(b=>b.status!=="Delivered"&&b.status!=="Cancelled").length}</div></div>
 </div>
 <div class="card"><h3>Quick Actions</h3>
 <button class="btn" onclick="showPage('bookings')">New Booking</button>
 <button class="btn goldbtn" onclick="showPage('biltis')">Create Bilti</button>
 <button class="btn greenbtn" onclick="showPage('payments')">Payment Entry</button>
 <button class="btn graybtn" onclick="showPage('challans')">Create Challan</button>
 </div>
 <div class="card">
