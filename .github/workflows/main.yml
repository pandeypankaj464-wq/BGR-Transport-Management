
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGRL | Transport Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f4fa;color:#17243b}
header{background:#102b55;color:white;padding:22px}
header h1{margin:0;font-size:23px}
header p{margin:6px 0 0;color:#d8e4f5;font-size:12px}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px;background:#fff}
nav button{border:0;padding:11px 15px;border-radius:7px;background:#e9eef7;color:#18345e;font-weight:bold;white-space:nowrap}
nav button.active{background:#174b91;color:white}
main{padding:16px;max-width:1100px;margin:auto}
h2{color:#153765}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:white;padding:17px;border-radius:12px;box-shadow:0 2px 9px #0000000c}
.card small{color:#66758c}
.card strong{display:block;font-size:25px;margin-top:9px;color:#174b91}
.panel{background:white;padding:18px;border-radius:12px;margin-top:15px}
input,select{width:100%;padding:12px;margin:6px 0 13px;border:1px solid #ccd5e2;border-radius:7px;font-size:15px}
label{font-size:13px;font-weight:bold}
.primary{background:#174b91;color:white;border:0;padding:13px 18px;border-radius:7px;font-weight:bold;width:100%}
.danger{background:#ffe8e8;color:#a51d1d;border:0;padding:7px;border-radius:5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 7px;border-bottom:1px solid #e5eaf1;text-align:left}
th{background:#edf2f9}
.tablewrap{overflow-x:auto}
.hidden{display:none}
footer{text-align:center;padding:25px;color:#718096;font-size:12px}
</style>
</head>
<body>
<header>
<h1>🚛 BOMBAY GUJARAT ROADLINES</h1>
<p>TRANSPORT & LOGISTICS MANAGEMENT</p>
</header>

<nav>
<button class="active" onclick="show('dashboard',this)">Dashboard</button>
<button onclick="show('booking',this)">New Booking</button>
<button onclick="show('records',this)">Bookings</button>
</nav>

<main>
<section id="dashboard">
<h2>Business Dashboard</h2>
<div class="cards">
<div class="card"><small>Total Bookings</small><strong id="total">0</strong></div>
<div class="card"><small>Total Freight</small><strong id="freight">₹0</strong></div>
<div class="card"><small>Total Brokerage</small><strong id="brokerage">₹0</strong></div>
<div class="card"><small>Pending Payments</small><strong id="pending">₹0</strong></div>
</div>
<div class="panel">
<h3>Welcome to BGRL Transport Hub</h3>
<p>Manage your transport bookings and business records in one place.</p>
</div>
</section>

<section id="booking" class="hidden">
<h2>New Truck Booking</h2>
<div class="panel">
<form id="bookingForm">
<label>Booking Date</label>
<input type="date" id="date" required>

<label>Customer Name</label>
<input id="customer" placeholder="Enter customer name" required>

<label>Customer Mobile</label>
<input id="mobile" type="tel" placeholder="Mobile number">

<label>Truck Owner Name</label>
<input id="owner" placeholder="Enter truck owner name" required>

<label>Truck Number</label>
<input id="truck" placeholder="GJ-XX-XX-XXXX" required>

<label>Driver Name</label>
<input id="driver" placeholder="Driver name">

<label>From</label>
<input id="from" placeholder="Loading location" required>

<label>To</label>
<input id="to" placeholder="Unloading location" required>

<label>Goods Description</label>
<input id="goods" placeholder="Type of goods">

<label>Total Freight (₹)</label>
<input id="amount" type="number" min="0" placeholder="Example: 50000" required>

<label>Brokerage (₹)</label>
<input id="commission" type="number" min="0" placeholder="Example: 2000" required>

<label>Payment Status</label>
<select id="status">
<option value="Pending">Pending</option>
<option value="Partial">Partial</option>
<option value="Paid">Paid</option>
</select>

<button class="primary" type="submit">Save Booking</button>
</form>
</div>
</section>

<section id="records" class="hidden">
<h2>Booking Records</h2>
<div class="panel">
<div class="tablewrap">
<table>
<thead>
<tr>
<th>Customer / Date</th>
<th>Truck</th>
<th>Route</th>
<th>Freight</th>
<th>Brokerage</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="bookingList"></tbody>
</table>
</div>
<p id="empty">No bookings added yet.</p>
</div>
</section>
</main>

<footer>BGRL Transport Hub | Bombay Gujarat Roadlines</footer>

<script>
let bookings = JSON.parse(localStorage.getItem("bgrlBookings") || "[]");

function save(){
localStorage.setItem("bgrlBookings",JSON.stringify(bookings));
render();
}

function show(id,button){
document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
if(id==="records") render();
}

document.getElementById("date").valueAsDate=new Date();

document.getElementById("bookingForm").addEventListener("submit",function(e){
e.preventDefault();

let item={
id:Date.now(),
date:date.value,
customer:customer.value.trim(),
mobile:mobile.value.trim(),
owner:owner.value.trim(),
truck:truck.value.trim(),
driver:driver.value.trim(),
from:document.getElementById("from").value.trim(),
to:document.getElementById("to").value.trim(),
goods:goods.value.trim(),
amount:Number(amount.value),
commission:Number(commission.value),
status:status.value
};

if(item.commission>item.amount){
alert("Brokerage cannot exceed total freight.");
return;
}

bookings.push(item);
save();
this.reset();
document.getElementById("date").valueAsDate=new Date();
alert("Booking saved successfully!");
});

function money(n){
return "₹"+Number(n).toLocaleString("en-IN");
}

function render(){
document.getElementById("total").textContent=bookings.length;
document.getElementById("freight").textContent=money(bookings.reduce((a,b)=>a+b.amount,0));
document.getElementById("brokerage").textContent=money(bookings.reduce((a,b)=>a+b.commission,0));
document.getElementById("pending").textContent=money(bookings.filter(b=>b.status!=="Paid").reduce((a,b)=>a+b.amount,0));

let list=document.getElementById("bookingList");
list.innerHTML="";
document.getElementById("empty").style.display=bookings.length?"none":"block";

bookings.slice().reverse().forEach(b=>{
let tr=document.createElement("tr");
let values=[
b.customer+" / "+b.date,
b.truck,
b.from+" → "+b.to,
money(b.amount),
money(b.commission),
b.status
];
values.forEach(v=>{
let td=document.createElement("td");
td.textContent=v;
tr.appendChild(td);
});
let action=document.createElement("td");
let del=document.createElement("button");
del.textContent="Delete";
del.className="danger";
del.onclick=()=>{
if(confirm("Delete this booking?")){
bookings=bookings.filter(x=>x.id!==b.id);
save();
}
};
action.appendChild(del);
tr.appendChild(action);
list.appendChild(tr);
});
}

render();
</script>
</body>
</html>
